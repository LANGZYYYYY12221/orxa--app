name: Build Flutter APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Project from Catbox
        run: wget -O project.zip "https://files.catbox.moe/uc2mon.zip"

      - name: Extract Project
        run: unzip project.zip

      - name: Fix Gradle Mirror
        run: sed -i 's|.*distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Kunci ke versi lama)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lennox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
